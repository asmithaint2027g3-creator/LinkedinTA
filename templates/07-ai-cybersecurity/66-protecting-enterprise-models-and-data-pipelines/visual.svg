          <text x="36" y="51" fill="#1d4ed8" font-size="14" font-weight="900" text-anchor="middle">✓</text>
          <text x="64" y="36" fill="#0b172a" font-size="16" font-weight="800">Vector Store Role-Based Access Control</text>
