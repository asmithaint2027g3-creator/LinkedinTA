          <rect x="0" y="0" width="1080" height="38" rx="14" fill="#eef2ff"/>
          <text x="24" y="24" fill="#6366f1" font-size="12" font-weight="800" letter-spacing="1.5">TIER 02: IDEMPOTENT TOOL EXECUTION</text>
          
          <g transform="translate(24, 60)">
            <text x="0" y="22" fill="#0b172a" font-size="18" font-weight="800">Idempotent Tool Execution</text>
            <text x="0" y="48" fill="#475569" font-size="14">Ensuring database mutations and financial transactions are never accidentally executed...</text>
          </g>

          <g transform="translate(900, 60)" text-anchor="end">
            <rect x="-140" y="4" width="140" height="30" rx="15" fill="#f8fafc" stroke="#e2e8f0"/>
            <text x="-70" y="24" fill="#334155" font-size="11" font-weight="700" text-anchor="middle">SOVEREIGN IP</text>
          </g>
        </g>

        
          <!-- Inter-Layer Data Pipe -->
