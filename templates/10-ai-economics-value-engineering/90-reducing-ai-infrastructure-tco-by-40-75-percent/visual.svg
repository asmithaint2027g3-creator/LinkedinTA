            <text x="0" y="46" fill="#475569" font-size="13">Optimizing CUDA kernels and batch sizes to...</text>
            <text x="0" y="80" fill="#dc2626" font-size="12" font-weight="700">Cost Drag: ~25-35% Capex Waste</text>
          </g>
        </g>
      
        <g transform="translate(365, 15)" filter="url(#cardShadow)">
          <rect width="345" height="155" rx="12" fill="#ffffff" stroke="#fecaca" stroke-width="1.5"/>
          <rect x="0" y="0" width="345" height="34" rx="12" fill="#fef2f2"/>
          <text x="16" y="22" fill="#991b1b" font-size="11.5" font-weight="800">LEAK 02: COST DESTABILIZER</text>
          
          <g transform="translate(16, 55)">
            <text x="0" y="18" fill="#0b172a" font-size="15.5" font-weight="800">Model Distillation &amp;...</text>
            <text x="0" y="46" fill="#475569" font-size="13">Replacing generic 400B frontier models with...</text>
            <text x="0" y="80" fill="#dc2626" font-size="12" font-weight="700">Cost Drag: ~25-35% Capex Waste</text>
          </g>
        </g>
      
        <g transform="translate(730, 15)" filter="url(#cardShadow)">
          <rect width="345" height="155" rx="12" fill="#ffffff" stroke="#fecaca" stroke-width="1.5"/>
          <rect x="0" y="0" width="345" height="34" rx="12" fill="#fef2f2"/>
          <text x="16" y="22" fill="#991b1b" font-size="11.5" font-weight="800">LEAK 03: COST DESTABILIZER</text>
          
          <g transform="translate(16, 55)">
            <text x="0" y="18" fill="#0b172a" font-size="15.5" font-weight="800">High-Density Hybrid...</text>
            <text x="0" y="46" fill="#475569" font-size="13">Repatriating steady-state inference...</text>
            <text x="0" y="80" fill="#dc2626" font-size="12" font-weight="700">Cost Drag: ~25-35% Capex Waste</text>
          </g>
        </g>
      
  </g>

