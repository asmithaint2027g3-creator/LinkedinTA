    <rect x="0" y="0" width="520" height="28" rx="14" fill="#e0e7ff" stroke="#c7d2fe" stroke-width="1"/>
    <text x="16" y="18" fill="#3730a3" font-size="11" font-weight="800" letter-spacing="1">AI FINOPS • UNIT TASK ECONOMICS • 40-75% TCO REDUCTION</text>
  </g>

  <!-- Primary Headline & Sub-headline -->
  <g transform="translate(60, 165)">
    
      <text x="0" y="42" fill="#0b172a" font-size="39" font-weight="900" letter-spacing="-0.8">
        REDUCING AI <tspan fill="#1d4ed8" text-decoration="underline" style="text-underline-offset: 6px;">INFRASTRUCTURE TCO</tspan>
      </text>
    

