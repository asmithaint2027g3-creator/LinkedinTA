          <rect x="0" y="0" width="345" height="34" rx="12" fill="#fef2f2"/>
          <text x="16" y="22" fill="#991b1b" font-size="11.5" font-weight="800">LEAK 01: COST DESTABILIZER</text>
          
          <g transform="translate(16, 55)">
