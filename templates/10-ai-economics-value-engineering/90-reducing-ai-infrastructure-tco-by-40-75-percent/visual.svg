      <text x="-140" y="23" fill="#1d4ed8" font-size="11" font-weight="700" letter-spacing="0.8" text-anchor="middle">AI ECONOMICS &amp; VALUE ENGINEERING • #090</text>
    </g>

    <line x1="0" y1="52" x2="1080" y2="52" stroke="#e2e8f0" stroke-width="1"/>
